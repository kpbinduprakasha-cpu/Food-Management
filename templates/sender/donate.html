{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <h2 class="mb-4">Donate Food</h2>
            <form method="POST" enctype="multipart/form-data">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="food_name" class="form-label">Food Name</label>
                        <input type="text" class="form-control" id="food_name" name="food_name" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="category_id" class="form-label">Food Category</label>
                        <select class="form-select" id="category_id" name="category_id" required>
                            <option value="">Select Category</option>
                            {% for cat in categories %}
                                <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="description" class="form-label">Food Description</label>
                    <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                </div>
                
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="quantity" class="form-label">Quantity</label>
                        <input type="number" step="0.1" class="form-control" id="quantity" name="quantity" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="unit" class="form-label">Unit</label>
                        <select class="form-select" id="unit" name="unit" required>
                            <option value="kg">kg</option>
                            <option value="servings">servings</option>
                            <option value="packets">packets</option>
                            <option value="liters">liters</option>
                            <option value="other">other</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="people_served" class="form-label">People Served (Approx)</label>
                        <input type="number" class="form-control" id="people_served" name="people_served">
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="food_image" class="form-label">Food Image</label>
                        <input type="file" class="form-control" id="food_image" name="food_image" accept="image/*">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="best_before" class="form-label">Available Until (Best Before)</label>
                        <input type="datetime-local" class="form-control" id="best_before" name="best_before" required>
                    </div>
                </div>
                
                <h5 class="mt-4 mb-3">Location Details</h5>
                
                <div class="mb-3">
                    <label for="pickup_location" class="form-label">Pickup Address</label>
                    <input type="text" class="form-control" id="pickup_location" name="pickup_location" required>
                </div>
                
                <!-- Map for Location Selection -->
                <div class="mb-3">
                    <label class="form-label">Pin Location on Map</label>
                    <div id="map" style="height: 300px; width: 100%; border-radius: 8px; border: 1px solid #ccc;"></div>
                    <input type="hidden" id="latitude" name="latitude">
                    <input type="hidden" id="longitude" name="longitude">
                </div>
                
                <div class="mb-3">
                    <label for="special_instructions" class="form-label">Special Instructions (Optional)</label>
                    <textarea class="form-control" id="special_instructions" name="special_instructions" rows="2"></textarea>
                </div>
                
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-success btn-lg">Publish Food Donation</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Initialize Map
        const map = L.map('map').setView([20.5937, 78.9629], 5); // Default to India
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        
        let marker;
        
        // Try to get user's location
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                
                map.setView([lat, lng], 15);
                
                marker = L.marker([lat, lng], {draggable: true}).addTo(map);
                
                document.getElementById('latitude').value = lat;
                document.getElementById('longitude').value = lng;
                
                marker.on('dragend', function(e) {
                    const pos = marker.getLatLng();
                    document.getElementById('latitude').value = pos.lat;
                    document.getElementById('longitude').value = pos.lng;
                });
            });
        }
        
        map.on('click', function(e) {
            if (marker) {
                marker.setLatLng(e.latlng);
            } else {
                marker = L.marker(e.latlng, {draggable: true}).addTo(map);
                marker.on('dragend', function(e) {
                    const pos = marker.getLatLng();
                    document.getElementById('latitude').value = pos.lat;
                    document.getElementById('longitude').value = pos.lng;
                });
            }
            document.getElementById('latitude').value = e.latlng.lat;
            document.getElementById('longitude').value = e.latlng.lng;
        });
    });
</script>
{% endblock %}
